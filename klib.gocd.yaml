format_version: 10
pipelines:
  klib:
    group: server
    label_template: ${COUNT}
    lock_behavior: none
    display_order: -1
    environment_variables:
      JAVA_HOME: /opt/jdk-25
    materials:
      git-klib:
        git: git@github.com:petrbalat/klib.git
        shallow_clone: true
        auto_update: true
        branch: master
    stages:
    - test:
        fetch_materials: true
        keep_artifacts: false
        clean_workspace: false
        approval:
          type: success
          allow_only_on_success: false
        jobs:
          test:
            timeout: 0
            # agent musí mít Docker (:spring-boot-process:dockerTest); mailpit (SMTP :1025, API :8025) tam běží jako služba
            # (bez `resources` — agenti žádné nemají, stejně jako u easyrent)
#            resources:
#              - docker
            artifacts:
            - test:
                source: "**/build/reports/tests/test"
                destination: reports
            - test:
                source: "**/build/test-results"
                destination: test-results
            tasks:
            # check = test všech modulů + dockerTest (Linux testy spring-boot-process)
            - exec:
                command: sh
                arguments:
                - ./gradlew
                - clean
                - check
                - --no-daemon
                run_if: passed

    - publish:
        fetch_materials: true
        keep_artifacts: false
        clean_workspace: false
        approval:
          type: manual
          allow_only_on_success: true
        # Gradle si ORG_GRADLE_PROJECT_<name> načte jako project property `ossrhPassword` (viz buildSrc/klibDsl.kt)
        # hodnotu zašifruj přes GoCD API (viz odpověď) a vlož místo zástupného textu
        secure_variables:
          ORG_GRADLE_PROJECT_ossrhPassword: "AES:027kQADuddQQkTi1L9MdFg==:jQV/bouuYEQ4qNj3Ka+goTjzX8cSdnSaY6QuTRvOoZF3B0mqp3ujgJ1Riukrukxs"
        jobs:
          publish:
            timeout: 0
            tasks:
            - exec:
                command: sh
                arguments:
                - ./gradlew
                - publish
                - --no-daemon
                run_if: passed
